{% extends "base.html" %}
{% block content %}
<section style="max-width:440px;padding:1rem 0 3rem">
  <p class="meta">Authorized reviewers</p>
  <h1 style="font-family:var(--font-display);letter-spacing:-0.02em;margin:0 0 1.25rem">Sign in</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form class="form panel" method="post" action="/login">
    <label>
      Email
      <input type="email" name="email" required autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
    <button class="btn btn-primary" type="submit">Continue</button>
  </form>
</section>
{% endblock %}
