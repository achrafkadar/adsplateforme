<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · Wenov</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/">Wenov <span>Ads</span></a>
      <nav class="nav">
        <a href="/privacy">Privacy</a>
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <form action="/logout" method="post" style="margin:0">
            <button class="btn btn-ghost" type="submit" style="padding:0.4rem 0.75rem;font-size:0.9rem">Sign out</button>
          </form>
        {% else %}
          <a href="/login">Sign in</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div>© Wenov · Ads Platform</div>
      <div><a href="/privacy">Privacy Policy</a></div>
    </footer>
  </div>
</body>
</html>
